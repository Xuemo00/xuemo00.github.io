<head>

<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; touch-action:none; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hint{
    position:absolute; left:0; right:0; bottom:22px; text-align:center;
    font-family:-apple-system,'Segoe UI',sans-serif; font-size:12px;
    color:rgba(200,195,225,.6); z-index:5; pointer-events:none; transition:opacity .6s ease;
  }
  #zoomIndicator{
    position:absolute; top:16px; right:16px; padding:4px 10px; border-radius:12px;
    background:rgba(255,255,255,.08); border:1px solid rgba(200,190,255,.25);
    color:#d9d2f5; font-family:-apple-system,'Segoe UI',sans-serif; font-size:11px; font-weight:600;
    z-index:5; pointer-events:none; opacity:0; transition:opacity .25s ease;
  }
  #photoOverlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,2,10,0);
    pointer-events:none;
    transition:background .35s ease;
  }
  #photoOverlay.show{ background:rgba(5,2,10,.68); pointer-events:auto; }
  #photoCard{
    position:relative;
    width:min(78vw, 340px);
    border-radius:18px;
    box-shadow:0 0 0 1px rgba(255,210,230,.35), 0 0 50px rgba(255,180,210,.35), 0 20px 60px rgba(0,0,0,.6);
    transform:scale(.82); opacity:0;
    transition:transform .38s cubic-bezier(.2,.9,.25,1.2), opacity .3s ease;
    background:#0a0710;
  }
  #photoOverlay.show #photoCard{ transform:scale(1); opacity:1; }
  #photoCard img{ display:block; width:100%; max-height:56vh; object-fit:cover; border-radius:18px; }
  #photoClose{
    position:absolute; top:-14px; right:-14px;
    width:34px; height:34px; border-radius:50%;
    background:#1a1220; border:1px solid rgba(255,210,230,.5);
    color:#ffe6f0; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:2;
  }

  /* ---------- Overlay de poema (Andrómeda) ---------- */
  #poemOverlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(5,2,10,0);
    pointer-events:none;
    transition:background .35s ease;
  }
  #poemOverlay.show{ background:rgba(5,2,10,.7); pointer-events:auto; }
  #poemCard{
    position:relative;
    width:min(84vw, 380px);
    max-height:70vh;
    padding:34px 26px 28px;
    border-radius:16px;
    background:linear-gradient(160deg, #211527, #150c1e 70%);
    box-shadow:0 0 0 1px rgba(255,190,230,.28), 0 0 60px rgba(210,150,255,.25), 0 20px 60px rgba(0,0,0,.6);
    transform:scale(.85); opacity:0;
    transition:transform .38s cubic-bezier(.2,.9,.25,1.2), opacity .3s ease;
    overflow-y:auto;
  }
  #poemOverlay.show #poemCard{ transform:scale(1); opacity:1; }
  #poemTitle{
    margin:0 0 14px; text-align:center;
    font-family:Georgia,'Times New Roman',serif; font-style:italic;
    font-size:15px; letter-spacing:.03em;
    color:#e7cdfa; opacity:.85;
  }
  #poemText{
    min-height:120px;
    font-family:Georgia,'Times New Roman',serif;
    font-size:16px; line-height:1.9; text-align:center;
    color:#f3e8ff; opacity:.92;
    white-space:pre-line;
  }
  #poemClose{
    position:absolute; top:-14px; right:-14px;
    width:34px; height:34px; border-radius:50%;
    background:#1a1220; border:1px solid rgba(230,190,255,.5);
    color:#f0e0ff; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:2;
  }

  /* ---------- Navegación entre planetas ---------- */
  .planetNavBtn{
    position:fixed; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(210,200,255,.35);
    color:#f0ecff; font-size:22px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:40; backdrop-filter:blur(6px);
    transition:transform .15s ease, background .15s ease;
  }
  .planetNavBtn:active{ transform:translateY(-50%) scale(.88); background:rgba(210,200,255,.25); }
  #planetPrevBtn{ left:12px; }
  #planetNextBtn{ right:12px; }
  #planetLabel{
    position:fixed; left:0; right:0; bottom:56px;
    text-align:center; z-index:40; pointer-events:none;
    font-family:-apple-system,'Segoe UI',sans-serif;
    font-size:15px; font-weight:700; color:#f2ecff;
    text-shadow:0 0 14px rgba(180,170,255,.6);
    opacity:0; transition:opacity .35s ease;
  }
  #planetLabel.show{ opacity:1; }

  /* ---------- Overlay de la Tierra: calendario compartido de "nos vimos" ---------- */
  #earthOverlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(3,6,12,0);
    pointer-events:none;
    transition:background .35s ease;
  }
  #earthOverlay.show{ background:rgba(3,6,12,.78); pointer-events:auto; }
  #earthCard{
    position:relative;
    width:min(92vw, 380px);
    padding:28px 18px 20px;
    border-radius:18px;
    background:linear-gradient(160deg, #0e2540, #081a30 70%);
    box-shadow:0 0 0 1px rgba(150,200,255,.3), 0 0 60px rgba(100,170,255,.25), 0 20px 60px rgba(0,0,0,.6);
    transform:scale(.85); opacity:0;
    transition:transform .38s cubic-bezier(.2,.9,.25,1.2), opacity .3s ease;
    text-align:center;
    font-family:-apple-system,'Segoe UI',sans-serif;
    max-height:82vh; overflow-y:auto;
  }
  #earthOverlay.show #earthCard{ transform:scale(1); opacity:1; }
  #earthTitle{ margin:0 0 14px; font-size:16px; font-weight:700; color:#dff0ff; }
  #earthContent p{ color:#eaf4ff; opacity:.85; font-size:12.5px; margin:4px 0; }
  #earthClose{
    position:absolute; top:-14px; right:-14px;
    width:34px; height:34px; border-radius:50%;
    background:#0d1a2c; border:1px solid rgba(150,200,255,.5);
    color:#dff0ff; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:2;
  }
  .whoBtn{
    display:block; width:100%; margin:8px 0; padding:12px; border-radius:12px; border:none;
    background:linear-gradient(135deg,#4fa1ff,#2f74d6); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  #calHeader{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  #calHeader button{
    width:32px; height:32px; border-radius:50%; border:1px solid rgba(150,200,255,.35);
    background:rgba(255,255,255,.06); color:#dff0ff; font-size:17px; font-weight:700; cursor:pointer;
  }
  #calMonthLabel{ color:#dff0ff; font-weight:700; font-size:14.5px; text-transform:capitalize; }
  #calWeekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  #calWeekdays span{ font-size:10.5px; color:#7fa8cc; font-weight:700; }
  #calGrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .calDay{
    position:relative; aspect-ratio:1/1; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; color:#cfe4fa; background:rgba(255,255,255,.04);
    cursor:pointer; user-select:none; border:1px solid transparent;
  }
  .calDay.empty{ visibility:hidden; cursor:default; }
  .calDay.mine{ border-color:rgba(140,190,255,.7); }
  .calDay.confirmed{
    background:radial-gradient(circle, rgba(255,110,150,.35), rgba(255,90,140,.12));
    border-color:rgba(255,140,170,.8);
    color:#fff;
  }
  .calDay .heart{ position:absolute; bottom:2px; font-size:9px; }
  #calLegend{ margin-top:12px !important; font-size:11px !important; line-height:1.5; }
  #calStatus{ font-size:11px; color:#8fbfe8; margin-top:6px; min-height:14px; }

  /* ---------- Modal de la Luna: Semáforo Emocional (fases lunares) ---------- */
  #moonOverlay{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(3,4,10,0);
    pointer-events:none;
    transition:background .35s ease;
  }
  #moonOverlay.show{ background:rgba(3,4,10,.78); pointer-events:auto; }
  #moonCard{
    position:relative;
    width:min(90vw, 380px);
    padding:26px 18px 20px;
    border-radius:18px;
    background:linear-gradient(160deg, #1a1a2e, #0c0c1a 70%);
    box-shadow:0 0 0 1px rgba(200,200,255,.25), 0 0 60px rgba(150,150,255,.2), 0 20px 60px rgba(0,0,0,.6);
    transform:scale(.85); opacity:0;
    transition:transform .38s cubic-bezier(.2,.9,.25,1.2), opacity .3s ease;
    text-align:center;
    font-family:-apple-system,'Segoe UI',sans-serif;
    max-height:82vh; overflow-y:auto;
  }
  #moonOverlay.show #moonCard{ transform:scale(1); opacity:1; }
  #moonTitle{ margin:0 0 4px; font-size:16px; font-weight:700; color:#eae8ff; }
  #moonSubtitle{ margin:0 0 16px; font-size:11.5px; color:#9a97c0; }
  #moonClose{
    position:absolute; top:-14px; right:-14px;
    width:34px; height:34px; border-radius:50%;
    background:#12121f; border:1px solid rgba(200,200,255,.4);
    color:#eae8ff; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:2;
  }
  .moodBtn{
    display:flex; align-items:center; gap:12px; width:100%;
    margin:8px 0; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05); color:#f0eeff; cursor:pointer; text-align:left;
  }
  .moodBtn:active{ background:rgba(255,255,255,.14); }
  .moodBtn .moodIcon{ font-size:26px; line-height:1; }
  .moodBtn .moodText{ font-size:13.5px; }
  .moodBtn .moodText b{ display:block; font-size:14.5px; }
  .moodBtn.llena{ border-color:rgba(255,210,120,.5); }
  .moodBtn.creciente{ border-color:rgba(255,160,190,.5); }
  .moodBtn.menguante{ border-color:rgba(255,150,100,.5); }
  .moodBtn.nueva{ border-color:rgba(140,150,255,.5); }
  #moonStatus{
    margin-top:14px; font-size:11.5px; color:#a9a6d6; padding-top:10px;
    border-top:1px solid rgba(255,255,255,.08); min-height:16px;
  }

  /* ---------- Librito virtual (Sol): libro 3D con paso de páginas ---------- */
  #bookOverlay{
    position:fixed; inset:0; z-index:60;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,6,4,0);
    pointer-events:none;
    transition:background .4s ease;
  }
  #bookOverlay.show{ background:rgba(12,8,6,.85); pointer-events:auto; }
  #bookScene{
    position:relative;
    width:min(88vw, 380px);
    height:min(72vh, 560px);
    perspective:1800px;
    transform:scale(.86); opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.25,1.2), opacity .35s ease;
  }
  #bookOverlay.show #bookScene{ transform:scale(1); opacity:1; }
  #bookStack{
    position:relative; width:100%; height:100%;
    transform-style:preserve-3d;
    box-shadow:0 25px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    border-radius:6px;
  }
  .bookPage{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform 1s cubic-bezier(.45,.05,.15,1);
    border-radius:6px;
  }
  .bookFace{
    position:absolute; inset:0;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:6px;
    background:#fbf6ee;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .bookFace.back{ transform:rotateY(180deg); }
  .bookFace svg.bookBg{ position:absolute; inset:0; width:100%; height:100%; }
  .bookFace .bookTextWrap{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:15% 12%;
    text-align:center;
  }
  .bookFace .bookText{
    font-family:'Cormorant Garamond', serif;
    font-style:italic; font-weight:500;
    font-size:16.5px; line-height:1.65;
    color:#4a4038;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .bookFace .bookCoverText{
    font-family:'Parisienne', cursive;
    font-size:26px; line-height:1.5; color:#5a4636;
  }
  .bookFace .pageNum{
    position:absolute; bottom:14px; right:18px;
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:11px; color:#9c8f7c;
  }
  #bookClose{
    position:absolute; top:-16px; right:-16px;
    width:36px; height:36px; border-radius:50%;
    background:#1a1220; border:1px solid rgba(255,230,210,.5);
    color:#fdf3e7; font-size:18px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:5;
  }
  .bookNavBtn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:42px; height:42px; border-radius:50%;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,235,215,.4);
    color:#fdf3e7; font-size:20px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:5; backdrop-filter:blur(4px);
  }
  #bookPrevBtn{ left:-52px; }
  #bookNextBtn{ right:-52px; }
  @media (max-width:520px){
    #bookPrevBtn{ left:6px; }
    #bookNextBtn{ right:6px; }
    .bookNavBtn{ background:rgba(20,14,10,.45); }
  }
  #bookPageIndicator{
    position:absolute; left:0; right:0; bottom:-30px; text-align:center;
    font-family:'Cormorant Garamond', serif; font-size:12px; color:#f0e4d4; opacity:.75;
  }

</style>

<div class="planetNavBtn" id="planetNextBtn">›</div>
<div id="planetLabel"></div>
<div id="earthOverlay">
  <div id="earthCard">
    <div id="earthClose">✕</div>
    <p id="earthTitle">🌍 Los días que nos vimos</p>
    <div id="earthContent"></div>
  </div>
</div>
<div id="bookOverlay">
  <div id="bookScene">
    <div id="bookStack"></div>
    <div id="bookClose">✕</div>
    <div class="bookNavBtn" id="bookPrevBtn">‹</div>
    <div class="bookNavBtn" id="bookNextBtn">›</div>
    <div id="bookPageIndicator"></div>
  </div>
</div>
<div id="moonOverlay">
  <div id="moonCard">
    <div id="moonClose">✕</div>
    <p id="moonTitle">🌙 ¿Cómo estás?</p>
    <p id="moonSubtitle">Elige tu fase — se guarda y se ve al instante en los dos celulares</p>
    <button class="moodBtn llena" data-phase="llena">
      <span class="moodIcon">🌕</span>
      <span class="moodText"><b>Luna Llena</b>Estoy feliz</span>
    </button>
    <button class="moodBtn creciente" data-phase="creciente">
      <span class="moodIcon">🌔</span>
      <span class="moodText"><b>Luna Creciente</b>Estoy pensando en ti</span>
    </button>
    <button class="moodBtn menguante" data-phase="menguante">
      <span class="moodIcon">🌗</span>
      <span class="moodText"><b>Cuarto Menguante</b>Ando muy estresad@</span>
    </button>
    <button class="moodBtn nueva" data-phase="nueva">
      <span class="moodIcon">🌑</span>
      <span class="moodText"><b>Luna Nueva</b>Necesito un abrazo</span>
    </button>
    <div id="moonStatus">todavía no hay nada marcado</div>
  </div>
</div>
<div id="poemOverlay">
  <div id="poemCard">
    <div id="poemClose">✕</div>
    <p id="poemTitle">Andrómeda</p>
    <div id="poemText">(aquí va a ir el poema)</div>
  </div>
</div>
<div id="photoOverlay">
  <div id="photoCard">
    <div id="photoClose">✕</div>
    <img id="photoCardImg" src="" alt="">
  </div>
</div>
